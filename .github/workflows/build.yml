name: Build Dobri Visual

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify mod JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p verified-mod

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR found in build/libs/"
            exit 1
          fi

          echo "Checking JAR: $JAR"
          jar tf "$JAR" > jar-contents.txt

          if ! grep -qx 'fabric.mod.json' jar-contents.txt; then
            echo "ERROR: fabric.mod.json
