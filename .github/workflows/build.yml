name: Build Dobri Visual

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Verify mod JAR
        run: |
          set -eu
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR found."
            exit 1
          fi
          echo "Checking: $JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'fabric.mod.json' jar-contents.txt || { echo "ERROR: fabric.mod.json missing"; exit 1; }
          grep -q '\.class$' jar-contents.txt || { echo "ERROR: No compiled classes"; exit 1; }
          ls -lh "$JAR"
          echo "JAR verification passed."

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dobri-Visual-jar
          path: build/libs/*.jar
          if-no-files-found: error
