name: Build Dobri Visual

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Diagnose Java compilation
        shell: bash
        run: |
          echo "=== Java source files ==="
          find src/main/java -type f -name '*.java' -print

          echo "=== Compiled class files ==="
          find build/classes -type f -name '*.class' -print 2>/dev/null || true

          echo "=== JAR files ==="
          find build/libs -maxdepth 1 -type f -name '*.jar' -exec ls -lh {} \;

          echo "=== Compile Java explicitly ==="
          gradle compileJava --no-daemon --info

      - name: Verify JAR
        shell: bash
        run: |
          set -eu
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: JAR not found"
            exit 1
          fi
          jar tf "$JAR" > jar-contents.txt
          grep -qx 'fabric.mod.json' jar-contents.txt || { echo "ERROR: fabric.mod.json missing"; exit 1; }
          grep -q '\.class$' jar-contents.txt || { echo "ERROR: No compiled classes"; exit 1; }
          echo "Verified JAR: $JAR"
          ls -lh "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dobri-Visual-jar
          path: build/libs/*.jar
          if-no-files-found: error
